name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # peaceiris 가 gh-pages 브랜치로 푸시

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: wasm-tools 워크로드
        run: dotnet workload install wasm-tools

      - name: dotcl 툴 설치
        run: dotnet tool install --global dotcl --version 0.1.25

      - name: dotcl 런타임/코어 경로 찾기 (툴 스토어 또는 NuGet 캐시)
        id: dotcl
        run: |
          RT=$(find ~/.dotnet/tools ~/.nuget/packages -name 'DotCL.Runtime.dll' 2>/dev/null | head -1)
          CORE=$(find ~/.dotnet/tools ~/.nuget/packages -name 'dotcl.core' 2>/dev/null | head -1)
          echo "runtime=$RT" >> "$GITHUB_OUTPUT"
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "찾음: RT=$RT CORE=$CORE"
          test -n "$RT" && test -n "$CORE"

      - name: 발행 (GitHub Pages 용)
        run: >
          dotnet publish -c Release
          -p:GHPages=true
          -p:GHPagesBase=/dotclblazorlispblocklywasm/
          -p:WasmFingerprintAssets=false
          -p:DotclRuntimeDll="${{ steps.dotcl.outputs.runtime }}"
          -p:DotclCoreFile="${{ steps.dotcl.outputs.core }}"
          -o publish

      - name: gh-pages 로 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish/wwwroot
          force_orphan: true
